# ==============================================================================
# USBGuard HID / BadUSB Detection Thresholds
# הגדרות ספי הרגישות לזיהוי מתקפות הזרקת מקשים (BadUSB / Rubber Ducky)
# ==============================================================================

# סף אירועים/תווים לשנייה (EPS - Events Per Second) למציאת הקלדה על-אנושית
eps_threshold: 20.0

# חלון הזמן (בשניות) לחישוב ממוצע קצב ההקלדה
window_seconds: 1.0

# כמות תווים מקסימלית בפרץ הקלדה (Burst) בודד
burst_chars: 30

# חלון הזמן (בשניות) לבדיקת פרץ ההקלדה (30 תווים ב-0.5 שניות יפעילו התראה)
burst_window_seconds: 0.5

# שונות זמנים מינימלית במילי-שניות (סטיית תקן). ערך נמוך מ-15ms מעיד על הקלדת תסריט/מחשב ולא אדם
low_variance_ms: 15.0

# הזמן במילי-שניות מחיבור ההתקן ועד תחילת ההקלדה (זיהוי הקלדה מיידית חשודה)
immediate_typing_ms: 700

# זמן צינון בשניות לאחר אירוע חשוד בטרם איפוס המדדים
cooldown_seconds: 10.0

# כמות אירועי מינימום שנרשמו לפני קבלת החלטה (למניעת התראות שווא)
min_events_for_decision: 12

# הפעולה שתתבצע בזיהוי התנהגות חשודה מהתקן לא מוכר (alert_only / block)
on_unknown_suspicious: alert_only